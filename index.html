<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belin, che band!</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-dark: #121212;
        --card-bg: #1e1e1e;
        --accent-music: #1DB954; /* Verde stile Spotify */
        --accent-secondary: #b3b3b3;
        --text-main: #ffffff;
        --error-color: #f44336;
      }

      body { 
        font-family: 'Poppins', sans-serif; 
        background-color: var(--bg-dark);
        color: var(--text-main);
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px 0;
        box-sizing: border-box;
      }

      .container { 
        background: var(--card-bg);
        padding: 30px 20px;
        border-radius: 25px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        width: 90%;
        max-width: 400px;
        text-align: center;
        box-sizing: border-box;
      }

      .icon { 
        font-size: 45px; 
        color: var(--accent-music); 
        margin-bottom: 10px; 
      }

      h2 { 
        margin: 0 0 10px 0; 
        font-size: 1.6rem; 
        color: var(--accent-music); 
        font-weight: 600;
      }

      .id-badge { 
        background: rgba(29, 185, 84, 0.1); 
        color: var(--accent-music); 
        padding: 5px 15px; 
        border: 1px solid var(--accent-music); 
        border-radius: 50px; 
        font-size: 0.8em; 
        margin-bottom: 25px; 
        display: inline-block; 
        letter-spacing: 1px;
        font-weight: 600;
      }

      .band-list { 
        max-height: 400px; 
        overflow-y: auto; 
        margin-bottom: 15px; 
        padding-right: 5px; 
      }

      /* Ottimizzazione barra di scorrimento per mobile */
      .band-list::-webkit-scrollbar { width: 5px; }
      .band-list::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

      .btn { 
        display: block; 
        width: 100%; 
        padding: 15px 10px; 
        margin: 12px 0; 
        font-size: 14px; 
        font-weight: 600; 
        cursor: pointer; 
        background: var(--accent-music); 
        color: #000000; 
        border: none; 
        border-radius: 50px; 
        text-transform: uppercase; 
        transition: transform 0.1s, filter 0.2s; 
        -webkit-tap-highlight-color: transparent;
        letter-spacing: 0.5px;
        box-sizing: border-box;
      }

      .btn:active { 
        transform: scale(0.96); 
        filter: brightness(0.9);
      }

      .btn:disabled { 
        background: #333; 
        color: #666; 
        cursor: not-allowed;
      }

      .loading { 
        display: none; 
        margin-top: 15px; 
        font-size: 0.85em; 
        color: var(--accent-music);
        animation: pulse 1.5s infinite; 
      }

      @keyframes pulse { 
        0%, 100% { opacity: 0.5; } 
        50% { opacity: 1; } 
      }
    </style>
  </head>
  <body>

    <div class="container" id="main-content">
      <div class="icon">🎸</div>
      <h2>Belin, che band!</h2>
      <div class="id-badge" id="token-display">TOKEN: Caricamento...</div>
      
      <div class="band-list">
        <button class="btn" onclick="inviaVoto('ALKEMIAN')">ALKEMIAN</button>
        <button class="btn" onclick="inviaVoto('ANNA AND THE MONKEYS')">ANNA AND THE MONKEYS</button>
        <button class="btn" onclick="inviaVoto('APPLEFIELD')">APPLEFIELD</button>
        <button class="btn" onclick="inviaVoto('BEAT UP')">BEAT UP</button>
        <button class="btn" onclick="inviaVoto('ESAPOP')">ESAPOP</button>
        <button class="btn" onclick="inviaVoto('ICOMPAGNIA LUNATICA')">ICOMPAGNIA LUNATICA</button>
        <button class="btn" onclick="inviaVoto('THE BEAT LESS & THEIR BACKING SINGERS')">THE BEAT LESS & THEIR BACKING SINGERS</button>
      </div>
      
      <div id="status" class="loading">Sincronizzazione voto con il database...</div>
    </div>

    <script>
      // 1. Recupera l'ID del token direttamente dai parametri dell'URL (?id=...)
      const urlParams = new URLSearchParams(window.location.search);
      const tokenID = urlParams.get('id') || "NESSUN_ID";
      
      // Mostra il token a video nell'interfaccia
      document.getElementById('token-display').innerText = "TOKEN: " + tokenID;

      // URL esatto della tua Web App di Google Apps Script (Aggiornato!)
      const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbypCEbpXkFnhVt8mn9y9FBys31v43-ITwg1DFrTwPWE44rG2jbGHCyEkZtjIDL9qYw/exec";

      function inviaVoto(bandScelta) {
        // Disabilita l'interfaccia ed evidenzia il caricamento
        document.getElementById('status').style.display = 'block';
        const buttons = document.getElementsByClassName('btn');
        for (let i = 0; i < buttons.length; i++) {
          buttons[i].disabled = true;
        }

        // Genera un nome di funzione univoco per il callback JSONP
        const callbackName = "jsonp_callback_" + Math.round(100000 * Math.random());
        
        // Definisce globalmente la funzione che riceverà la risposta da Google
        window[callbackName] = function(data) {
          const messaggio = data.risultato;
          const esitoErrore = messaggio.includes("Errore");
          
          // Icona impostata su Stella (⭐) per un feedback chiaro e positivo
          const iconaFinale = esitoErrore ? "❌" : "⭐";
          const coloreTesto = esitoErrore ? "var(--error-color)" : "var(--accent-music)";

          // Sostituisce l'intera card con la schermata di responso finale
          document.getElementById('main-content').innerHTML = `
            <div style="font-size: 60px; margin-bottom: 20px;">${iconaFinale}</div>
            <h2 style="color: ${coloreTesto}">${messaggio}</h2>
            <p style="color: var(--accent-secondary); margin-top: 20px;">Goditi il festival!</p>
          `;

          // Pulizia del tag script creato per la chiamata
          document.body.removeChild(scriptTag);
          delete window[callbackName];
        };

        // Creazione dell'URL per la chiamata JSONP cross-origin
        const urlCompleto = `${GOOGLE_SCRIPT_URL}?id=${encodeURIComponent(tokenID)}&scelta=${encodeURIComponent(bandScelta)}&callback=${callbackName}`;

        // Inserisce dinamicamente lo script per avviare la chiamata
        const scriptTag = document.createElement('script');
        scriptTag.src = urlCompleto;
        document.body.appendChild(scriptTag);
      }
    </script>

  </body>
</html>
